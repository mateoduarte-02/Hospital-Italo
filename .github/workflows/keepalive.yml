# Mantiene activa la base de datos de Supabase (plan gratuito).
# Supabase pausa los proyectos gratuitos tras 7 dias sin actividad; este
# flujo hace una consulta liviana cada 2 dias para que eso no pase.
name: Mantener Supabase activo

on:
  schedule:
    - cron: "0 12 */2 * *"   # cada 2 dias, 12:00 UTC (09:00 Argentina)
  workflow_dispatch:          # permite correrlo a mano desde la pestana Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base de datos
        run: |
          curl --fail --silent --show-error \
            "https://ydsxbteoraiwowrrlzlz.supabase.co/rest/v1/medicamentos?select=id&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlkc3hidGVvcmFpd293cnJsemx6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2ODAwODksImV4cCI6MjEwMDI1NjA4OX0.yXH1cSolLwtvDanoCUMybgkoQ3D_vACdCXruxM2fUsg" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlkc3hidGVvcmFpd293cnJsemx6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2ODAwODksImV4cCI6MjEwMDI1NjA4OX0.yXH1cSolLwtvDanoCUMybgkoQ3D_vACdCXruxM2fUsg"
